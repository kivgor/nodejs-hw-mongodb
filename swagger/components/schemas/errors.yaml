type: object
required:
  - message
  - path
  - type
  - context
properties:
  message:
    description: 'Message with information about wrong validation of request'
    type: string
    example: 'Name should have at least 3 characters'
  path:
    description: 'An array contains the name of a parameter that has not been validated correctly'
    type: array
    example: ['name']
  type:
    description: 'Short description of the error that occurred during validation'
    type: string
    example: string.min
  context:
    description: 'Additional information about error'
    type: object
    required:
      - label
      - key
    properties:
      limit:
        description: 'The limit of value'
        type: number
        example: 3
      value:
        description: 'The value from request'
        type: string
        example: 'Jo'
      label:
        description: 'The label of parameter'
        type: string
        example: 'name'
      key:
        description: 'The key of parameter'
        type: string
        example: 'name'
