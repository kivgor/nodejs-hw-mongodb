tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch a contact by id with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '67f6af106295fb9453060cb7'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Phone number'
            type: string
            example: '097 123-45-67'
          email:
            description: 'Email'
            type: string
            example: 'john@gmail.com'
          isFavourite:
            description: 'Whether the contact favourite'
            type: boolean
            example: false
          contactType:
            description: 'The type of contact'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Patch a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Not found error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Contact not found'
